[project]
name = "ex4pm-plan"
version = "0.1.0"
description = "Lean planning/search compute worker for ex4pm, derived from Airbus scikit-decide"
authors = [
  {name = "Airbus AI Research", email = "scikit-decide@airbus.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["planning", "search", "ex4pm", "cloud"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "networkx>=3.0",
  "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.20.1,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "wrapt>=2.2.1",
]

[project.urls]
repository = "https://github.com/seanchatmangpt/ex4pm-plan"
upstream = "https://github.com/airbus/scikit-decide"

[project.scripts]
ex4pm-plan = "ex4pm_plan.worker:main"

[project.entry-points."skdecide.domains"]
GraphDomain = "skdecide.hub.domain.graph_domain.GraphDomain:GraphDomain"

[project.entry-points."skdecide.solvers"]
Astar = "skdecide.hub.solver.astar:Astar"
BFWS = "skdecide.hub.solver.bfws:BFWS"
IW = "skdecide.hub.solver.iw:IW"

[dependency-groups]
test = [
  "build>=1.2",
  "pytest>=8,<9",
]

[build-system]
requires = ["scikit-build-core>=0.11.6,<1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
logging.level = "INFO"
wheel.packages = ["src/skdecide", "src/ex4pm_plan"]
wheel.install-dir = "skdecide/hub"
cmake.source-dir = "cpp"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
ONLY_PYTHON = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests/ex4pm_plan"]
