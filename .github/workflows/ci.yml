name: ex4pm-plan lean verification

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ggen-manufacture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: 0
      GGEN_SOURCE_SHA: 1e9fcb9679a61460fbd641415cb72511c7e50b33
    steps:
      - name: Checkout exact ex4pm-plan subject
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            printf 'REFUSED_INEXACT_SUBJECT expected=%s actual=%s\n' "$expected" "$actual" >&2
            exit 70
          }

      - name: Set up Python admission court
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install RDF verifier
        run: python -m pip install "rdflib>=7,<8"

      - name: Verify committed graph projection before manufacture
        run: python scripts/verify_ggen_projection.py | tee /tmp/ggen-projection-before.json

      - name: Checkout pinned ggen runtime source
        uses: actions/checkout@v6
        with:
          repository: seanchatmangpt/ggen
          ref: 1e9fcb9679a61460fbd641415cb72511c7e50b33
          path: .ggen-runtime
          persist-credentials: false

      - name: Install pinned ggen Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22

      - name: Build exact ggen CLI
        run: cargo build --manifest-path .ggen-runtime/Cargo.toml -p ggen-cli-lib --bin ggen

      - name: Dry-run ggen manufacture
        run: .ggen-runtime/target/debug/ggen sync run --dry-run | tee /tmp/ggen-sync-dry.json

      - name: Execute ggen manufacture
        run: .ggen-runtime/target/debug/ggen sync run | tee /tmp/ggen-sync.json

      - name: Verify manufactured graph projection
        run: python scripts/verify_ggen_projection.py | tee /tmp/ggen-projection-after.json

      - name: Verify ggen receipt chain
        run: .ggen-runtime/target/debug/ggen receipt verify | tee /tmp/ggen-receipt.json

      - name: Prove deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum src/ex4pm_plan/generated_contract.py | awk '{print $1}')"
          .ggen-runtime/target/debug/ggen sync run | tee /tmp/ggen-sync-replay.json
          after="$(sha256sum src/ex4pm_plan/generated_contract.py | awk '{print $1}')"
          test "$before" = "$after" || {
            printf 'REFUSED_NONDETERMINISTIC_PROJECTION before=%s after=%s\n' "$before" "$after" >&2
            exit 71
          }
          git diff --exit-code -- src/ex4pm_plan/generated_contract.py

      - name: Upload ggen manufacture evidence
        uses: actions/upload-artifact@v4
        with:
          name: ex4pm-plan-ggen-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/ggen-projection-before.json
            /tmp/ggen-sync-dry.json
            /tmp/ggen-sync.json
            /tmp/ggen-projection-after.json
            /tmp/ggen-receipt.json
            /tmp/ggen-sync-replay.json
            .ggen-v2/receipt.json
            .ggen-v2/receipt-log.jsonl
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: ggen-manufacture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source and retained submodules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            printf 'REFUSED_INEXACT_SUBJECT expected=%s actual=%s\n' "$expected" "$actual" >&2
            exit 70
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.26,<4" ninja build pytest "rdflib>=7,<8"

      - name: Independent ggen projection court
        run: python scripts/verify_ggen_projection.py

      - name: Build and install lean fork
        run: python -m pip install -e .

      - name: Focused worker tests
        run: pytest -q tests/ex4pm_plan

      - name: Worker capability smoke
        run: |
          ex4pm-plan capabilities | tee /tmp/capabilities.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/capabilities.json'))
          assert data['standing'] == 'ALIVE'
          assert data['worker_solvers'] == ['astar']
          assert data['library_solvers'] == ['astar', 'bfws', 'iw']
          assert data['authority'] == 'CONSTRUCT_ONLY'
          assert data['actuation'] is False
          PY

      - name: Exact solve smoke
        run: |
          cat > /tmp/problem.json <<'JSON'
          {"solver":"astar","problem":{"type":"deterministic_graph","initial":"A","goals":["G"],"edges":[{"from":"A","to":"G","action":"expensive","cost":5},{"from":"A","to":"B","action":"to_b","cost":1},{"from":"B","to":"G","action":"to_g","cost":1}]}}
          JSON
          ex4pm-plan solve < /tmp/problem.json | tee /tmp/result.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          assert data['standing'] == 'ALIVE'
          assert data['evidence']['replay_verified'] is True
          assert data['result']['total_cost'] == 2.0
          PY

      - name: Build wheel
        run: python -m build --wheel
